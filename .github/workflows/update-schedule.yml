name: Update volleyball schedule

on:
  schedule:
    # Runs every 6 hours (UTC). Adjust the cron expression if you want a
    # different cadence - e.g. '0 */2 * * *' for every 2 hours during the
    # season, or '0 8,20 * * *' for twice a day at 8am/8pm UTC.
    - cron: '0 */6 * * *'
  workflow_dispatch:
    # Lets you trigger this manually from the Actions tab on GitHub, for
    # testing without waiting for the schedule.

permissions:
  contents: write
  # Required so this workflow can commit the updated JSON files back to
  # the repo. If this step fails with a permissions error, check
  # Settings -> Actions -> General -> Workflow permissions on GitHub and
  # make sure "Read and write permissions" is selected.

jobs:
  update-schedule:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Snapshot previous run's data (for health check comparison)
        run: |
          cp sidearm_games.json sidearm_games_previous.json 2>/dev/null || true
          cp presto_games.json presto_games_previous.json 2>/dev/null || true

      - name: Fetch Sidearm schedules
        run: python3 fetch_sidearm_schedules.py

      # PrestoSports fetch is intentionally NOT run here right now.
      # RSS DOES dodge the IP block that hits the regular HTML page from
      # GitHub Actions (confirmed working - real data came back, no 405).
      # BUT Olivet Nazarene's RSS composite feed hasn't been updated with
      # the current 2026-27 season yet (same lag problem Orange Coast's
      # feed has, just less severe) - so automating it right now would
      # keep overwriting good manually-fetched data with stale RSS data
      # every 6 hours. presto_games.json is updated manually for BOTH
      # schools - run `python3 fetch_presto_schedules.py` on your own
      # machine, then commit and push. Worth re-enabling
      # fetch_rss_schedules.py here once Olivet Nazarene's admin adds the
      # new season to their composite feed - check back periodically.

      - name: Build unified schedule
        run: python3 build_unified_schedule.py

      - name: Check schedule health
        id: healthcheck
        continue-on-error: true
        run: python3 check_health.py

      - name: Send alert email/text if health check failed
        if: steps.healthcheck.outcome == 'failure'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Volleyball dashboard: schedule check found issues"
          to: ${{ secrets.NOTIFY_TO }}
          from: Volleyball Dashboard
          body: file://health_alerts.txt

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sidearm_games.json presto_games.json unified_schedule.json
          git diff --staged --quiet || git commit -m "Auto-update schedule data"
          git push
