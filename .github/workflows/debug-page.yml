name: Debug a schedule page

# Manual only: prints a Sidearm schedule page's raw text lines and what the
# parser makes of them, for fixing parser problems when the school's site
# can't be reached from where you are. Changes nothing in the repo.
on:
  workflow_dispatch:
    inputs:
      url:
        description: "Schedule page URL, or 'all' to print every Sidearm school's parsed games"
        type: string
        required: true

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - name: Raw lines
        if: inputs.url != 'all'
        env:
          URL: ${{ inputs.url }}
        run: python3 debug_raw_lines.py "$URL" all
      - name: Parsed games
        if: inputs.url != 'all'
        env:
          URL: ${{ inputs.url }}
        run: python3 -c 'import json,os; from fetch_sidearm_schedules import fetch_and_parse; print(json.dumps(fetch_and_parse(os.environ["URL"]), indent=1))'
      # One line per game for every school (current season URLs), so runs
      # before and after a parser change can be diffed.
      - name: Parsed games, all schools
        if: inputs.url == 'all'
        run: |
          python3 - <<'PY'
          import json
          from fetch_sidearm_schedules import fetch_and_parse
          for e in json.load(open("sidearm_games.json")):
              for g in fetch_and_parse(e["url"]):
                  print("GAME", e["school"], "|", json.dumps(g, sort_keys=True))
          PY
