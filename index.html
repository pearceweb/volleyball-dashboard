<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MN Select Alumni — This Week</title>
<style>
  :root {
    --ink: #0e1a26;
    --panel: #142433;
    --line: rgba(255,255,255,0.08);
    --text: #eef2f5;
    --text-dim: #9fb0bd;
    --amber: #e8a33d;
    --win: #4caf7d;
    --loss: #d9695f;
    --home: #4c8fe0;
    --away: #b58ae0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--ink);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    line-height: 1.5;
  }
  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 24px 16px 60px;
  }
  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 20px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--line);
  }
  h1 {
    font-size: 20px;
    font-weight: 600;
    margin: 0;
    letter-spacing: 0.2px;
  }
  .subtitle {
    font-size: 13px;
    color: var(--text-dim);
    margin-top: 2px;
  }
  .range-controls {
    display: flex;
    gap: 6px;
    margin-bottom: 20px;
  }
  .range-btn {
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--text-dim);
    font-size: 13px;
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-family: inherit;
  }
  .range-btn.active {
    color: var(--ink);
    background: var(--amber);
    border-color: var(--amber);
    font-weight: 600;
  }
  .day-group { margin-bottom: 22px; }
  .day-group.past { opacity: 0.6; }
  .filter-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 20px;
  }
  .player-select {
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--text);
    font-size: 13px;
    padding: 6px 10px;
    border-radius: 6px;
    font-family: inherit;
    max-width: 100%;
  }
  #site-footer {
    max-width: 720px;
    margin: 40px auto 0;
    padding: 20px 16px 10px;
    border-top: 1px solid var(--line);
    text-align: center;
    font-size: 12px;
    color: var(--text-dim);
  }
  #site-footer a {
    color: var(--amber);
    text-decoration: none;
  }
  #site-footer a:hover {
    text-decoration: underline;
  }
  .quick-jump {
    margin-bottom: 18px;
  }
  .quick-jump .range-btn {
    width: 100%;
    text-align: center;
    background: var(--amber);
    color: var(--ink);
    font-weight: 600;
    border-color: var(--amber);
  }
  .today-divider {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 8px 0 22px;
    color: var(--amber);
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .today-divider::before,
  .today-divider::after {
    content: "";
    flex: 1;
    height: 2px;
    background: var(--amber);
  }
  .day-label {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--text-dim);
    margin-bottom: 8px;
    padding-left: 4px;
  }
  .game-row {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--panel);
    border-radius: 8px;
    padding: 12px 14px;
    margin-bottom: 6px;
    border-left: 3px solid var(--home);
  }
  .game-row.away { border-left-color: var(--away); }
  .game-row.neutral { border-left-color: var(--text-dim); }
  .time-col {
    font-variant-numeric: tabular-nums;
    font-size: 13px;
    color: var(--text-dim);
    width: 68px;
    flex-shrink: 0;
  }
  .main-col { flex: 1; min-width: 0; }
  .player-line {
    font-size: 14px;
    font-weight: 600;
  }
  .player-line .school {
    font-weight: 400;
    color: var(--text-dim);
  }
  .matchup-line {
    font-size: 13px;
    color: var(--text-dim);
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .side-tag {
    text-transform: uppercase;
    font-size: 11px;
    font-weight: 700;
    margin-right: 5px;
  }
  .result-col {
    flex-shrink: 0;
    text-align: right;
    min-width: 64px;
  }
  .score {
    font-size: 14px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .score.win { color: var(--win); }
  .score.loss { color: var(--loss); }
  .watch-link {
    display: inline-block;
    font-size: 12px;
    color: var(--amber);
    text-decoration: none;
    border: 1px solid var(--amber);
    border-radius: 5px;
    padding: 3px 8px;
    margin-top: 2px;
  }
  .cal-link {
    display: inline-block;
    font-size: 11px;
    color: var(--text-dim);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 5px;
    padding: 2px 7px;
    margin-top: 6px;
    cursor: pointer;
    font-family: inherit;
  }
  .cal-link:hover {
    color: var(--text);
    border-color: var(--text-dim);
  }
  .print-only { display: none; }

  @media print {
    body {
      background: #fff !important;
      color: #111 !important;
    }
    .range-controls,
    .player-select,
    #print-btn,
    .quick-jump,
    .watch-link,
    .cal-link,
    #site-footer {
      display: none !important;
    }
    .print-only {
      display: block;
      font-size: 12px;
      color: #444;
      margin-bottom: 14px;
    }
    h1 { color: #111; }
    .subtitle { display: none; }
    .day-label { color: #555; }
    .day-group.past { opacity: 1 !important; }
    .game-row {
      background: #fff !important;
      border: 1px solid #ccc;
      border-left-width: 3px;
      break-inside: avoid;
    }
    .time-col, .matchup-line { color: #444 !important; }
    .player-line .school { color: #555 !important; }
    .score.win { color: #1a7a3f !important; }
    .score.loss { color: #b3261e !important; }
    .today-divider { color: #b3261e; }
    .today-divider::before,
    .today-divider::after { background: #b3261e; }
  }
  .empty-state {
    text-align: center;
    color: var(--text-dim);
    padding: 60px 20px;
    font-size: 14px;
  }
  .error-state {
    text-align: center;
    color: var(--loss);
    padding: 40px 20px;
    font-size: 14px;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>This week</h1>
      <div class="subtitle" id="range-label">Loading schedule...</div>
    </div>
  </header>
  <div id="print-context" class="print-only"></div>
  <div class="filter-row">
    <div class="range-controls">
      <button class="range-btn active" data-days="7">This week</button>
      <button class="range-btn" data-days="14">Next 2 weeks</button>
      <button class="range-btn" data-days="30">Next month</button>
      <button class="range-btn" data-days="all">All available games</button>
    </div>
    <select id="player-filter" class="player-select">
      <option value="">All players</option>
    </select>
    <button id="print-btn" class="range-btn" onclick="window.print()">Print / Save as PDF</button>
  </div>
  <div id="content"></div>
</div>
<footer id="site-footer"></footer>

<script>
let allGames = [];
let currentDays = 7;
let currentPlayer = "";
let renderedGames = [];

function formatDayLabel(dateIso) {
  const d = new Date(dateIso + "T00:00:00");
  return d.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });
}

function getDataRange(games) {
  const dated = (games || allGames).filter(g => g.date_iso).map(g => g.date_iso).sort();
  if (dated.length === 0) return null;
  return { min: dated[0], max: dated[dated.length - 1] };
}

function render() {
  const content = document.getElementById("content");
  const rangeLabel = document.getElementById("range-label");
  const today = new Date();
  today.setHours(0,0,0,0);
  renderedGames = [];

  const playerFiltered = currentPlayer
    ? allGames.filter(g => `${g.player} - ${g.school}` === currentPlayer)
    : allGames;
  const playerSuffix = currentPlayer ? ` \u00b7 ${currentPlayer}` : "";

  let inRange;
  if (currentDays === "all") {
    inRange = playerFiltered.filter(g => g.date_iso);
    rangeLabel.textContent = `All available games${playerSuffix} \u00b7 ${inRange.length} game${inRange.length === 1 ? "" : "s"}`;
  } else {
    const end = new Date(today);
    end.setDate(end.getDate() + currentDays - 1);
    inRange = playerFiltered.filter(g => {
      if (!g.date_iso) return false;
      const d = new Date(g.date_iso + "T00:00:00");
      return d >= today && d <= end;
    });
    rangeLabel.textContent = `${today.toLocaleDateString(undefined, {month:"short", day:"numeric"})} \u2013 ${end.toLocaleDateString(undefined, {month:"short", day:"numeric"})}${playerSuffix} \u00b7 ${inRange.length} game${inRange.length === 1 ? "" : "s"}`;
  }
  document.getElementById("print-context").textContent = rangeLabel.textContent;

  if (inRange.length === 0) {
    const range = getDataRange(playerFiltered);
    if (range) {
      const minLabel = new Date(range.min + "T00:00:00").toLocaleDateString(undefined, {month:"long", day:"numeric", year:"numeric"});
      const maxLabel = new Date(range.max + "T00:00:00").toLocaleDateString(undefined, {month:"long", day:"numeric", year:"numeric"});
      content.innerHTML = `<div class="empty-state">No games in this range.<br>The data on hand covers ${minLabel} \u2013 ${maxLabel}.<br><br><button class="range-btn" onclick="jumpToAll()">Show all available games</button></div>`;
    } else {
      content.innerHTML = '<div class="empty-state">No game data loaded yet.</div>';
    }
    return;
  }

  const byDay = {};
  for (const g of inRange) {
    (byDay[g.date_iso] = byDay[g.date_iso] || []).push(g);
  }
  const days = Object.keys(byDay).sort();
  const todayStr = today.toISOString().slice(0, 10);
  const hasPast = days.some(d => d < todayStr);
  const hasFuture = days.some(d => d >= todayStr);
  const upcomingCount = inRange.filter(g => g.date_iso >= todayStr).length;

  let dividerInserted = false;
  const pieces = [];
  if (hasPast && hasFuture) {
    pieces.push(`<div class="quick-jump"><button class="range-btn" onclick="jumpToUpcoming()">Jump to upcoming games (${upcomingCount})</button></div>`);
  }
  for (const day of days) {
    if (!dividerInserted && day >= todayStr && hasPast) {
      pieces.push(`<div class="today-divider" id="today-marker"><span>Today</span></div>`);
      dividerInserted = true;
    }
    const games = byDay[day].sort((a, b) => (a.time || "").localeCompare(b.time || ""));
    const rows = games.map(g => {
      const idx = renderedGames.push(g) - 1;
      return renderRow(g, idx);
    }).join("");
    const isPast = day < todayStr;
    pieces.push(`<div class="day-group${isPast ? " past" : ""}"><div class="day-label">${formatDayLabel(day)}</div>${rows}</div>`);
  }
  content.innerHTML = pieces.join("");
}

function jumpToUpcoming() {
  const marker = document.getElementById("today-marker");
  if (marker) marker.scrollIntoView({ behavior: "smooth", block: "start" });
}

function renderRow(g, idx) {
  const sideTag = g.home_away === "home" ? "vs" : g.home_away === "away" ? "@" : "vs";
  const played = !!g.result;
  const timeDisplay = played ? "Final" : (g.time || "TBA");

  let resultHtml = "";
  if (played) {
    const cls = g.result === "W" ? "win" : "loss";
    resultHtml = `<div class="score ${cls}">${g.result} ${g.sets || ""}</div>`;
  } else if (g.streaming_label) {
    resultHtml = `<span class="watch-link">${escapeHtml(g.streaming_label)}</span>`;
  } else if (g.streaming_url) {
    resultHtml = `<a class="watch-link" href="${escapeAttr(g.streaming_url)}" target="_blank" rel="noopener">Watch</a>`;
  }

  const calendarLink = (!played && g.date_iso)
    ? `<button class="cal-link" onclick="addToCalendar(${idx})" title="Add to calendar">+ Calendar</button>`
    : "";

  return `
    <div class="game-row ${g.home_away}">
      <div class="time-col">${timeDisplay}</div>
      <div class="main-col">
        <div class="player-line">${escapeHtml(g.player)} <span class="school">\u00b7 ${escapeHtml(g.school)}</span></div>
        <div class="matchup-line"><span class="side-tag">${sideTag}</span>${escapeHtml(g.opponent || "TBD")}</div>
        ${calendarLink}
      </div>
      <div class="result-col">${resultHtml}</div>
    </div>
  `;
}

function escapeHtml(s) {
  if (!s) return "";
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function escapeAttr(s) {
  return escapeHtml(s).replace(/"/g,"&quot;");
}

function pad2(n) { return String(n).padStart(2, "0"); }

function parseGameTime(g) {
  // Sidearm games have a clean g.time field ("6 p.m.", "9:00 PM"). Presto
  // games don't have a separate time field - if a real time is showing,
  // it's sitting in g.status instead (e.g. "7:00 PM CST"). Either way we
  // just need to find an hour/am-pm pattern somewhere in the text.
  const raw = g.time || (g.status && /\d/.test(g.status) ? g.status : null);
  if (!raw) return null;
  const m = raw.match(/(\d{1,2})(?::(\d{2}))?\s*([ap])\.?m\.?/i);
  if (!m) return null;
  let hour = parseInt(m[1], 10);
  const min = m[2] ? parseInt(m[2], 10) : 0;
  const ap = m[3].toLowerCase();
  if (ap === "p" && hour !== 12) hour += 12;
  if (ap === "a" && hour === 12) hour = 0;
  return { hour, min };
}

function icsEscape(s) {
  return (s || "").replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\n/g, "\\n");
}

function icsNowUTC() {
  const d = new Date();
  return `${d.getUTCFullYear()}${pad2(d.getUTCMonth() + 1)}${pad2(d.getUTCDate())}T${pad2(d.getUTCHours())}${pad2(d.getUTCMinutes())}${pad2(d.getUTCSeconds())}Z`;
}

function buildICS(g) {
  const [y, mo, d] = g.date_iso.split("-");
  const hm = parseGameTime(g);
  let dtStartLine, dtEndLine;

  if (!hm) {
    // No resolvable time - make it an all-day event (iCal end date = next day)
    dtStartLine = `DTSTART;VALUE=DATE:${y}${mo}${d}`;
    const end = new Date(g.date_iso + "T00:00:00");
    end.setDate(end.getDate() + 1);
    dtEndLine = `DTEND;VALUE=DATE:${end.getFullYear()}${pad2(end.getMonth() + 1)}${pad2(end.getDate())}`;
  } else {
    const start = new Date(`${g.date_iso}T${pad2(hm.hour)}:${pad2(hm.min)}:00`);
    dtStartLine = `DTSTART:${start.getFullYear()}${pad2(start.getMonth() + 1)}${pad2(start.getDate())}T${pad2(start.getHours())}${pad2(start.getMinutes())}00`;
    const end = new Date(start);
    end.setHours(end.getHours() + 2); // default 2-hour match duration
    dtEndLine = `DTEND:${end.getFullYear()}${pad2(end.getMonth() + 1)}${pad2(end.getDate())}T${pad2(end.getHours())}${pad2(end.getMinutes())}00`;
  }

  const sideTag = g.home_away === "home" ? "vs" : g.home_away === "away" ? "@" : "vs";
  const summary = `${g.school} (${g.player}) ${sideTag} ${g.opponent || "TBD"}`;
  const descParts = [g.school];
  if (g.streaming_label) descParts.push(`Watch: ${g.streaming_label}`);
  if (g.streaming_url) descParts.push(`Watch: ${g.streaming_url}`);
  const uid = `${g.player}-${g.school}-${g.date_iso}-${g.opponent || ""}`.replace(/[^a-zA-Z0-9]/g, "") + "@volleyball-dashboard";

  return [
    "BEGIN:VCALENDAR",
    "VERSION:2.0",
    "PRODID:-//Volleyball Dashboard//EN",
    "BEGIN:VEVENT",
    `UID:${uid}`,
    `DTSTAMP:${icsNowUTC()}`,
    dtStartLine,
    dtEndLine,
    `SUMMARY:${icsEscape(summary)}`,
    `DESCRIPTION:${icsEscape(descParts.join("\n"))}`,
    `LOCATION:${icsEscape(g.location || "")}`,
    "END:VEVENT",
    "END:VCALENDAR",
  ].join("\r\n");
}

function addToCalendar(idx) {
  const g = renderedGames[idx];
  if (!g) return;
  const ics = buildICS(g);
  const blob = new Blob([ics], { type: "text/calendar;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `${g.player.replace(/\s+/g, "-")}-vs-${(g.opponent || "TBD").replace(/\s+/g, "-")}.ics`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

document.querySelectorAll(".range-btn[data-days]").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".range-btn[data-days]").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    const val = btn.dataset.days;
    currentDays = val === "all" ? "all" : parseInt(val, 10);
    render();
  });
});

function jumpToAll() {
  document.querySelectorAll(".range-btn[data-days]").forEach(b => b.classList.remove("active"));
  document.querySelector('.range-btn[data-days="all"]').classList.add("active");
  currentDays = "all";
  render();
}

function populatePlayerFilter() {
  const select = document.getElementById("player-filter");
  const labels = [...new Set(allGames.map(g => `${g.player} - ${g.school}`))];
  labels.sort((a, b) => a.localeCompare(b));
  for (const label of labels) {
    const opt = document.createElement("option");
    opt.value = label;
    opt.textContent = label;
    select.appendChild(opt);
  }
}

document.getElementById("player-filter").addEventListener("change", (e) => {
  currentPlayer = e.target.value;
  render();
});

function renderFooter() {
  const year = new Date().getFullYear();
  document.getElementById("site-footer").innerHTML =
    `&copy; ${year} <a href="https://tuckerpearcecreative.com" target="_blank" rel="noopener">Tucker Pearce Creative</a>`;
}
renderFooter();

fetch("unified_schedule.json")
  .then(r => {
    if (!r.ok) throw new Error("Could not load unified_schedule.json (" + r.status + ")");
    return r.json();
  })
  .then(data => {
    allGames = data;
    populatePlayerFilter();
    render();
  })
  .catch(err => {
    document.getElementById("content").innerHTML =
      `<div class="error-state">Couldn't load the schedule.<br>${escapeHtml(err.message)}<br><br>Make sure unified_schedule.json is in the same folder as this page.</div>`;
    document.getElementById("range-label").textContent = "Error loading data";
  });
</script>
</body>
</html>
